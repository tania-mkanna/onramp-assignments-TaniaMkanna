services:

  postgres:
    image: pgvector/pgvector:pg16

    container_name: rag-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_scraper

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: rag-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data
  crawl-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker

    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rag_scraper

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - postgres
      - redis

  processing-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker

    restart: unless-stopped

    command: ["npx", "tsx", "scraper/src/workers/processingWorker.ts"]

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rag_scraper
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data: